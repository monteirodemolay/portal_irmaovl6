 ["Memória acessível", "Registros reunidos para pesquisa e preservação.", 6], ["Formação com continuidade", "Estudo que pode prosseguir entre os encontros.", 7]], "notes": "Inovar significa melhorar a forma como servimos à Loja. Os benefícios esperados estão ligados a tarefas concretas: consultar a próxima sessão, encontrar um contato, recuperar uma fotografia e retomar uma leitura. Esses resultados dependem de informações atualizadas e da participação dos Irmãos. Os quatro temas podem ser clicados para ir diretamente aos respectivos slides. Tempo: 60 segundos."}, {"kind": "screen", "title": "Um ponto de encontro digital", "body": "O Início reúne a próxima sessão, eventos, avisos e atalhos.", "benefit": "Uma referência comum para acompanhar a vida da Loja.", "screen": "inicio", "name": "Início", "notes": "A página inicial é o ponto de partida. Ela apresenta os próximos compromissos e caminhos para os demais módulos. Cada cartão leva à consulta dos detalhes. O objetivo é reduzir a dispersão das informações e facilitar o acompanhamento da rotina. Clique na tela para ampliar se precisar mostrar um elemento. Tempo: 50 segundos."}, {"kind": "screen", "title": "Agenda que favorece a participação", "body": "Sessões e eventos da Loja ao lado dos compromissos pessoais.", "benefit": "Mais clareza para planejar a presença e acompanhar atividades.", "screen": "agenda", "name": "Minha Agenda", "notes": "A Minha Agenda reúne atividades institucionais e compromissos pessoais. Os filtros ajudam a distinguir sessões, eventos e outras categorias. Conforme a atividade, o Irmão pode consultar detalhes e responder sobre sua presença. Há opções de integração com calendários externos. A contribuição prática é permitir que cada um se organize melhor. Tempo: 50 segundos."}, {"kind": "screen", "title": "A comunidade mais próxima", "body": "Perfis, contatos e serviços ajudam os Irmãos a se conhecerem.", "benefit": "Mais oportunidades de convivência e apoio mútuo.", "screen": "irmaos", "name": "Diretório dos Irmãos", "notes": "O Diretório facilita a localização de Irmãos e a consulta dos dados disponíveis. Também conecta informações pessoais, trajetórias e negócios. Cada Irmão pode manter seus dados e preferências no Meu Espaço e em Configurações. A aproximação depende do uso respeitoso das informações e do contato humano. Tempo: 50 segundos."}, {"kind": "interlude", "title": "A memória da Loja<br>merece continuidade", "body": "Fotografias, documentos e trajetórias<br>ajudam a contar o que vivemos juntos.", "bg": "memoria", "action": "Ver fotografias reais", "screen": "fotos", "name": "Fotos e Vídeos", "notes": "Uma fotografia guarda mais do que uma imagem: ela registra pessoas, vínculos e momentos da nossa história. O Acervo oferece caminhos para recuperar esses registros e relacioná-los ao seu contexto. A imagem de fundo é uma ilustração simbólica. O botão abre a captura real da galeria de eventos. Tempo: 45 segundos."}, {"kind": "screen", "title": "Acervo VL6", "body": "Documentos, fotografias, eventos e gestões em caminhos de pesquisa conectados.", "benefit": "A história fica mais fácil de localizar e compreender.", "screen": "acervo", "name": "Acervo VL6", "alternate": {"screen": "fotos", "name": "Fotos e Vídeos"}, "notes": "O Acervo organiza a consulta por tipos de registro e por relações com pessoas, eventos e gestões. A pesquisa integrada ajuda a encontrar conteúdos em áreas diferentes. Fotografias vinculadas a acontecimentos preservam seu contexto. O Irmão também pode contribuir com a memória, encaminhando arquivos para análise. As contagens dependem dos registros disponíveis. Tempo: 60 segundos."}, {"kind": "screen", "title": "Conhecimento que acompanha o Irmão", "body": "Aulas, atividades e progresso pessoal, com leituras ligadas à Biblioteca.", "benefit": "Continuidade do estudo entre os encontros da Loja.", "screen": "conhecimento", "name": "Conhecimento VL6", "alternate": {"screen": "biblioteca", "name": "Biblioteca"}, "notes": "O Conhecime on></div>${brandbar()}`;}else if(s.kind==='impact'){content=`<div class="content"><h2>${s.title}</h2><p>${s.sub}</p><div class="impact-list">${s.points.map((p,i)=>`<button class="impact-item" data-jump="${p[2]}"><span class="num">0${i+1}</span><span><strong>${p[0]}</strong><span class="text">${p[1]}</span></span></button>`).join('')}</div></div>`;}else if(s.kind==='screen'){content=`<div class="content"><div><h2>${s.title}</h2><p>${s.body}</p><div class="benefit">${s.benefit}</div></div><figure class="figure"><button class="imagebtn" id="screenzoom" aria-label="Ampliar tela ${s.name}"><img id="screenimg" src="${assets[s.screen]}" alt="Tela real do Portal: ${s.name}"></button><figcaption><span id="screenname">${s.name}</span>${s.alternate?`<button class="switcher" id="switchscreen">Ver ${s.alternate.name}</button>`:'<span>Clique para ampliar</span>'}</figcaption></figure></div>`;}else if(s.kind==='interlude'){content=`<div class="content"><h2>${s.title}</h2><p>${s.body}</p><button class="linkbtn" id="openreal">${s.action} <span aria-hidden="true">›</span></button></div>`;}else{content=`<div class="content"><h2>${s.title}</h2><p>${s.body}</p>${brandbar()}<a class="url" href="https://portal.vl6.com.br" target="_blank" rel="noopener noreferrer">portal.vl6.com.br</a></div>`;}const node=$('slide');node.className=s.kind;node.innerHTML=common+content+`<div class="institution">A∴R∴B∴G∴B∴L∴S∴ Verdadeira Luz nº 6</div><div class="slide-no">${String(current+1).padStart(2,'0')}</div>`;node.style.animation='none';void node.offsetHeight;node.style.animation='';$('count').textContent=`${current+1} / ${slides.length}`;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('progress').style.width=((current+1)/slides.length*100)+'%';$('live').textContent=`Slide ${current+1}: ${s.title.replace(/<br>/g,' ')}`;document.title=`${current+1}. ${s.title.replace(/<br>/g,' ')} — Portal VL6`;history.replaceState(null,'','#slide-'+(current+1));node.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(Number(b.dataset.jump)));node.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>go(current+1));if($('screenzoom'))$('screenzoom').onclick=()=>zoom(alternate?s.alternate.screen:s.screen,alternate?s.alternate.name:s.name);if($('switchscreen'))$('switchscreen').onclick=()=>{alternate=!alternate;let v=alternate?s.alternate:s;$('screenimg').src=assets[v.screen];$('screenimg').alt='Tela real do Portal: '+v.name;$('screenname').textContent=v.name;$('switchscreen').textContent='Ver '+(alternate?s.name:s.alternate.name);$('screenzoom').setAttribute('aria-label','Ampliar tela '+v.name);};if($('openreal'))$('openreal').onclick=()=>zoom(s.screen,s.name);updateNotes();}function go(n){n=Math.max(0,Math.min(slides.length-1,n));if(n===current)return;current=n;render();}function modal(content){$('modalcontent').innerHTML=content;$('dialog').showModal();}function zoom(key,name){modal(`<h3>${esc(name)}</h3><img class="zoom-img" src="${assets[key]}" alt="Captura real da tela ${esc(name)}"><p class="caption">Portal do Irmão VL6</p>`);}function index(){modal(`<h3>Índice da apresentação</h3><div class="indexgrid">${slides.map((s,i)=>`<button data-index="${i}"><span>${String(i+1).padStart(2,'0')}</span>${s.title.replace(/<br>/g,' ')}</button>`).join('')}</div>`);$('modalcontent').querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{$('dialog').close();go(Number(b.dataset.index));});}async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('Use F11 no navegador para entrar em tela cheia.');}}function toast(t){$('announcement').textContent=t;$('announcement').style.opacity=1;setTimeout(()=>$('announcement').style.opacity=0,3500);}function notes(){if(notesWindow&&!notesWindow.closed){notesWindow.focus();return;}notesWindow=window.open('','VL6Roteiro','width=820,height=700');if(!notesWindow){toast('Permita a janela do roteiro no navegador.');return;}notesWindow.document.open();notesWindow.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Roteiro do apresentador VL6</title><style>body{background:#071525;color:#f5f0e7;font:20px/1.6 Arial;padding:30px;margin:0}h1{font:36px Georgia;margin:15px 0}small{color:#e5bd68}p{max-width:740px}button{background:#263b51;color:white;border:1px solid #b99b59;padding:12px 22px;font:18px Arial;margin-right:10px;cursor:pointer}.hint{font-size:15px;color:#bec9d5}</style><small id="number"></small><h1 id="title"></h1><p id="text"></p><button id="back">Anterior</button><button id="forward">Próximo</button><p class="hint">Mantenha esta janela no computador e projete somente a apresentação. Em espelhamento, feche o roteiro antes de apresentar.</p></html>`);notesWindow.document.close();notesWindow.document.getElementById('back').onclick=()=>go(current-1);notesWindow.document.getElementById('forward').onclick=()=>go(current+1);updateNotes();}function updateNotes(){if(!notesWindow||notesWindow.closed)return;try{const d=notesWindow.document,s=slides[current];d.getElementById('number').textContent=`SLIDE ${current+1} DE ${slides.length}`;d.getElementById('title').textContent=s.title.replace(/<br>/g,' ');d.getElementById('text').textContent=s.notes;}catch{}}function blackout(){$('blackout').classList.toggle('active');}function effects(){document.body.classList.toggle('animated');$('animation').setAttribute('aria-pressed',String(document.body.classList.contains('animated')));toast(document.body.classList.contains('animated')?'Efeitos ativados':'Efeitos desativados');}function fit(){const w=innerWidth,h=innerHeight;document.documentElement.style.setProperty('--scale',Math.min(w/1600,h/900));}document.addEventListener('keydown',e=>{keyboardInput=true;if(e.key==='Tab')showControls();if($('dialog').open)return;if($('blackout').classList.contains('active')){if(['b','B','Escape',' '].includes(e.key)){e.preventDefault();blackout();}return;}if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1);}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1);}else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);}else if(e.key.toLowerCase()==='f')fullscreen();else if(e.key.toLowerCase()==='i')index();else if(e.key.toLowerCase()==='n')notes();else if(e.key.toLowerCase()==='b')blackout();else if(e.key.toLowerCase()==='a')effects();else if(e.key.toLowerCase()==='c'){e.preventDefault();toggleControls();}});$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('index').onclick=index;$('fullscreen').onclick=fullscreen;$('notes').onclick=notes;$('animation').onclick=effects;$('blackout').onclick=blackout;$('help').onclick=()=>modal('<h3>Controles da apresentação</h3><div class="helpgrid"><kbd>← →</kbd><span>Slide anterior ou próximo</span><kbd>Espaço</kbd><span>Avançar</span><kbd>F</kbd><span>Tela cheia</span><kbd>I</kbd><span>Índice de slides</span><kbd>N</kbd><span>Roteiro em janela separada</span><kbd>B</kbd><span>Tela preta ou retorno</span><kbd>A</kbd><span>Ativar ou desativar efeitos</span><kbd>C</kbd><span>Mostrar ou ocultar a barra de controles</span><kbd>Esc</kbd><span>Fechar ampliação ou índice</span></div><p style="margin-top:25px">A barra se oculta automaticamente. Mova o mouse para a parte inferior ou pressione C para exibi-la. Clique nas telas para ampliar. A apresentação funciona sem internet. O acesso ao Portal exige conexão.</p>');$('dialog').querySelector('.close').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close();});let tx=0;document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;},{passive:true});document.addEventListener('touchend',e=>{if($('dialog').open)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>75)go(current+(dx<0?1:-1));},{passive:true});window.addEventListener('resize',fit);window.addEventListener('beforeunload',()=>{if(notesWindow&&!notesWindow.closed)notesWindow.close();});let controlsTimer=null,controlsHover=false,keyboardInput=false;function hideControls(){clearTimeout(controlsTimer);if($('toolbar').contains(document.activeElement))document.activeElement.blur();document.body.classList.add('controls-hidden');}function scheduleControlsHide(){clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>{if(controlsHover||$('dialog').open||(keyboardInput&&$('toolbar').contains(document.activeElement)))return;hideControls();},3000);}function showControls(){document.body.classList.remove('controls-hidden');scheduleControlsHide();}function toggleControls(){if(document.body.classList.contains('controls-hidden'))showControls();else hideControls();}document.addEventListener('pointermove',e=>{keyboardInput=false;if(e.clientY>=innerHeight-85)showControls();});document.addEventListener('pointerdown',e=>{keyboardInput=false;if(e.clientY>=innerHeight-85)showControls();});$('toolbar').addEventListener('pointerenter',e=>{if(e.pointerType==='touch')return;controlsHover=true;clearTimeout(controlsTimer);});$('toolbar').addEventListener('pointerleave',()=>{controlsHover=false;scheduleControlsHide();});$('toolbar').addEventListener('focusin',showControls);$('toolbar').addEventListener('focusout',scheduleControlsHide);$('toolbar').addEventListener('click',scheduleControlsHide);$('hidecontrols').onclick=hideControls;$('dialog').addEventListener('close',scheduleControlsHide);showControls();const initial=Number(location.hash.replace('#slide-',''));if(Number.isInteger(initial)&&initial>=1&&initial<=slides.length)current=initial-1;fit();render();
</script></body></html>
