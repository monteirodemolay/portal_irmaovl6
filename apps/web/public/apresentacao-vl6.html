else if(['courses','journey','quick'].includes(view))out+=`<h2>${view==='journey'?'Minha Jornada':view==='quick'?'Em poucos minutos':'Formações'}</h2>${view==='courses'?'<label>Buscar formação<input id="demo-course-search" placeholder="Buscar por título" value="'+esc(demoState.query)+'"></label>':''}<div class="demo-grid" id="demo-course-results">${demoCourses.map((c,i)=>demoState.query&&view==='courses'&&!c.title.toLowerCase().includes(demoState.query.toLowerCase())?'':courseCard(c,i)).join('')}</div>`;
else if(view==='activities')out+=`<h2>Atividades</h2><p>Aplique o que aprendeu e acompanhe seu resultado.</p><div class="demo-grid">${demoCourses.map((c,i)=>demoState.progress[i].includes(2)?'':`<section class="demo-card"><span class="demo-badge">Avaliação</span><h3>Verifique seu aprendizado</h3><p>${c.title}</p>${demoButton('Abrir atividade','assessment',i)}</section>`).join('')}</div>`;
else if(view==='progress')out+=`<h2>Meu Progresso</h2><p>Seu aprendizado é pessoal. Cada etapa tem seu próprio ritmo.</p><section class="demo-card">${demoCourses.map((c,i)=>`<div class="demo-row"><div><h3>${c.title}</h3><small>${coursePercent(i)}% dos conteúdos · ${coursePercent(i)===100?'Concluído':'Em andamento'}</small><div class="preview-progress"><span style="width:${coursePercent(i)}%"></span></div></div>${demoButton('Ver formação','course',i,true)}</div>`).join('')}</section>`;
else if(view==='course')out+=`<h1>${c.title}</h1><div class="demo-two"><section class="demo-card"><span class="demo-badge">${c.category}</span><h2 style="margin-top:20px">Aperfeiçoamento institucional</h2><p>${c.responsible}</p><p>13 min · 2 módulos</p><div class="preview-progress"><span style="width:${p}%"></span></div>${demoButton(p?'Continuar formação':'Iniciar formação','lesson',demoState.progress[i].includes(0)?1:0)}</section><section class="demo-card"><h2>Conteúdo da formação</h2><h3>1. Estudo e reflexão</h3>${demoLessonNames.slice(0,2).map((l,n)=>`<div class="demo-actions">${demoButton((demoState.progress[i].includes(n)?'✓ ':'')+l,'lesson',n,true)}</div>`).join('')}<h3>2. Aplicação</h3>${demoButton((demoState.progress[i].includes(2)?'✓ ':'')+demoLessonNames[2],'lesson',2,true)}</section></div><section class="demo-card"><h2>Para aprofundar seus conhecimentos</h2><p>Biblioteca VL6 · ${demoBooks[0].title}</p>${demoButton('Ver na Biblioteca','reference',0)}</section>`;
else if(view==='lesson'){const l=demoState.lesson;out+=`<h1>${c.title}</h1><p>${demoLessonNames[l]}</p><div class="demo-lesson"><aside class="demo-card"><h2>Conteúdo da formação</h2><div class="preview-progress"><span style="width:${p}%"></span></div>${demoLessonNames.map((t,n)=>`<div class="demo-actions">${demoButton((demoState.progress[i].includes(n)?'✓ ':'')+t,'lesson',n,true)}</div>`).join('')}</aside><section class="demo-card">${l===2?`<form class="demo-quiz" data-form="quiz"><h2>Verifique seu aprendizado</h2><p>Qual atitude favorece a convivência e a participação na Loja?</p><label><input type="radio" name="answer" value="0" required>Ouvir com respeito, acompanhar a Agenda e contribuir de forma responsável.</label><label><input type="radio" name="answer" value="1">Consultar informações somente quando outra pessoa solicitar.</label><label><input type="radio" name="answer" value="2">Compartilhar qualquer informação sem conferir sua finalidade.</label>${demoButton('Enviar respostas','submit-quiz')}</form>`:`<article class="demo-paper"><h2>${demoLessonNames[l]}</h2><p>${l===0?'A vida da Loja se fortalece com presença, escuta e participação. Acompanhar os compromissos, acolher os Irmãos e contribuir com responsabilidade são atitudes que favorecem a convivência.':'Reserve um momento para refletir sobre como você pode contribuir com a Loja. Uma leitura, uma conversa respeitosa e o registro de uma lembrança são caminhos simples para manter essa participação.'}</p><p>Conteúdo fictício elaborado para demonstrar uma aula de texto.</p></article><div class="demo-actions">${demoButton('Marcar como concluída','complete',l)}${demoButton('Próxima aula','lesson',l+1,true)}</div>`}</section></div>`;}return out;}
function captureDraft(){const root=$('demo-root');for(const k of ['recipient','label','title','body']){const el=root.querySelector('[name="'+k+'"]');if(el)demoState.draft[k]=el.value;}}
function demoCripta(){const x=demoState.draft;let out='<div class="demo-hero"><h1>Cripta Digital VL6</h1><p>Uma mensagem pessoal para guardar através do tempo.</p><span class="demo-badge">Janela de escrita aberta (exemplo)</span></div>';
if(demoState.view==='panel')out+=`<div class="demo-stats"><section class="demo-card"><b>1</b><small>Rascunho guardado</small></section><section class="demo-card"><b>0</b><small>Cartas enviadas</small></section><section class="demo-card"><b>5</b><small>Limite de cartas</small></section></div><section class="demo-card"><h2>Minhas cartas</h2><p>Escreva no seu tempo. Continue um rascunho, revise o destinatário e confira o conteúdo.</p><article class="demo-paper"><h2>Rascunho guardado</h2><p>Para ${esc(x.recipient)} · ${esc(x.label)}</p><p>${esc(x.body.slice(0,165))}…</p>${demoButton('Continuar minha carta','write')}</article></section>`;
else if(demoState.view==='write')out+=`<h1>Escrever minha carta</h1><p>1 de 2 · Prepare sua carta</p><form data-form="draft" class="demo-card"><div class="demo-letter-fields"><label>Para quem é esta carta?<input name="recipient" maxlength="100" value="${esc(x.recipient)}" required></label><label>Como você vai reconhecer esta carta depois?<input name="label" maxlength="80" value="${esc(x.label)}"></label></div><label>Título<input name="title" value="${esc(x.title)}"></label><label>Sua mensagem<textarea name="body" class="demo-letter-body" required>${esc(x.body)}</textarea></label><p id="demo-draft-status">Rascunho demonstrativo pronto para revisão.</p><div class="demo-actions">${demoButton('Revisar minha carta','review-letter')}${demoButton('Guardar rascunho e voltar','keep-draft','',true)}</div></form>`;
else if(demoState.view==='review')out+=`<h1>Sua carta está pronta para revisão</h1><p>2 de 2 · Confira a prévia</p><article class="demo-paper"><small>Verdadeira Luz nº 06 · Cripta do Irmão</small><h2 style="margin-top:20px">${esc(x.title)}</h2><p>Para ${esc(x.recipient)}</p><p style="white-space:pre-wrap">${esc(x.body)}</p><small>Uma mensagem para guardar através do tempo</small></article><div class="demo-actions">${demoButton('Voltar à escrita','write','',true)}${demoButton('Guardar rascunho','keep-draft')}</div><p>A guarda definitiva segue o período e os procedimentos institucionais da Cripta.</p>`;return out;}
function renderDemo(){const root=$('demo-root');root.innerHTML=`<div class="demo-shell ${demoState.app==='conhecimento'?'demo-dark':demoState.app==='cripta'?'demo-cripta':''}"><header class="demo-top"><img src="${assets.portal}" alt="Portal VL6"><nav class="demo-tabs" aria-label="Módulos demonstrativos">${[['Biblioteca','biblioteca'],['Conhecimento','conhecimento'],['Cripta','cripta']].map(([t,k])=>`<button data-demo="app" data-value="${k}" ${demoState.app===k?'aria-current="page"':''}>${t}</button>`).join('')}</nav></header><div class="demo-banner"><span>Demonstração com dados fictícios</span><span>As ações ficam apenas nesta apresentação.</span></div><main class="demo-main">${demoState.message?`<div class="demo-notice" role="status">${esc(demoState.message)}</div>`:''}${demoState.app==='biblioteca'?demoLibrary():demoState.app==='conhecimento'?demoKnowledge():demoCripta()}</main><footer class="demo-footer">A∴R∴B∴G∴B∴L∴S∴ Verdadeira Luz nº 6</footer></div>`;
root.onclick=e=>{const b=e.target.closest('[data-demo]');if(!b||b.disabled)return;if(b.closest('form')&&['submit-cart','submit-loan','submit-review','submit-quiz','review-letter','keep-draft'].includes(b.dataset.demo))return;e.preventDefault();demoAction(b.dataset.demo,b.dataset.value);};root.onsubmit=e=>{e.preventDefault();const form=e.target;if(!form.reportValidity())return;const a=new FormData(form);if(form.dataset.form==='cart'||form.dataset.form==='loan'){demoState.requests.push({ids:form.dataset.form==='cart'?[...demoState.cart]:[demoState.book],pickup:String(a.get('pickup'))});if(form.dataset.form==='cart')demoState.cart=[];demoState.view='loans';demoState.message='Solicitação demonstrativa registrada. No Portal, o Bibliotecário analisa o pedido antes da retirada.';}else if(form.dataset.form==='review'){demoState.reviews[demoState.book]={rating:a.get('rating'),comment:String(a.get('comment'))};demoState.message='Sua avaliação demonstrativa foi registrada.';}else if(form.dataset.form==='quiz'){if(a.get('answer')==='0'){if(!demoState.progress[demoState.course].includes(2))demoState.progress[demoState.course].push(2);demoState.message='Resposta correta. Aproveitamento demonstrativo: 100%. Seu progresso foi atualizado.';}else demoState.message='Reveja a aula: escuta respeitosa e participação responsável favorecem a convivência. Tente novamente.';}else if(form.dataset.form==='draft'){captureDraft();const action=e.submitter?.dataset.demo;if(action==='review-letter'){demoState.view='review';demoState.message='';}else{demoState.view='panel';demoState.message='Rascunho mantido nesta demonstração.';}}renderDemo();};
const search=$('demo-course-search');if(search)search.oninput=()=>{demoState.query=search.value;$('demo-course-results').innerHTML=demoCourses.map((c,i)=>c.title.toLowerCase().includes(demoState.query.toLowerCase())?courseCard(c,i):'').join('')||'<p>Nenhuma formação encontrada para essa busca.</p>';};root.querySelectorAll('[name="recipient"],[name="label"],[name="title"],[name="body"]').forEach(el=>el.oninput=()=>{captureDraft();$('demo-draft-status').textContent='Rascunho atualizado nesta demonstração.';});}
function demoAction(action,value){demoState.message='';const n=Number(value);if(action==='app'){demoState.app=value;demoState.view=value==='biblioteca'?'catalog':value==='conhecimento'?'home':'panel';demoState.query='';}
else if(action==='book'){demoState.book=n;demoState.view='book';}else if(action==='add'){if(!demoState.cart.includes(n))demoState.cart.push(n);demoState.message='Obra adicionada ao carrinho demonstrativo.';}else if(action==='remove')demoState.cart=demoState.cart.filter(id=>id!==n);else if(action==='reference'){demoState.app='biblioteca';demoState.view='book';demoState.book=n;}else if(action==='course'){demoState.course=n;demoState.view='course';}else if(action==='assessment'){demoState.course=n;demoState.lesson=2;demoState.view='lesson';}else if(action==='lesson'){demoState.lesson=n;demoState.view='lesson';}else if(action==='complete'){if(!demoState.progress[demoState.course].includes(n))demoState.progress[demoState.course].push(n);demoState.message='Aula concluída na demonstração. Consulte Meu progresso.';}else if(action==='download'){downloadDemoBook();return;}else if(action==='keep-draft'){captureDraft();demoState.view='panel';demoState.message='Rascunho mantido nesta demonstração.';}else demoState.view=action;renderDemo();}
function downloadDemoBook(){const b=demoBooks[demoState.book],text=`BIBLIOTECA VL6\nPUBLICAÇÃO DEMONSTRATIVA\n\n${b.title}\n${b.author}\n\n${b.synopsis}\n\n${b.tip}\n\nEste arquivo foi criado para exemplificar o download. Não é uma obra catalogada na Loja.`;const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Leitura_Demonstrativa_VL6.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);demoState.message='Arquivo demonstrativo preparado para download.';renderDemo();}

showControls();const initial=Number(location.hash.replace('#slide-',''));if(Number.isInteger(initial)&&initial>=1&&initial<=slides.length)current=initial-1;fit();render();
</script></body></html>
