<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal VL6 — Área do Irmão</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--ink:#0b1b33;--muted:#5b6b82;--line:#dfe5ee;--navy:#0a1d3a;--navy2:#13294d;--gold:#d4af37;--ok:#1f7a4d;--okbg:#e3f4ea;--warn:#8a5a00;--warnbg:#fff1d6;--pilot:#6a3fa0;--pilotbg:#efe6fa;--gap:#a12b2b;--gapbg:#fde6e6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1220;--surface:#121c2e;--ink:#e8edf5;--muted:#9fb0c7;--line:#243553;--okbg:#12362a;--warnbg:#3b2d10;--pilotbg:#2a1f40;--gapbg:#3d1a1a;--ok:#6fd6a0;--warn:#f0c46a;--pilot:#c9a8f5;--gap:#f29a9a}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
nav{background:var(--navy);color:#dbe5f5;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font:700 17px Georgia,serif;color:#fff;margin:4px 10px 2px}
nav small{display:block;margin:0 10px 16px;color:#8fa3c4;font-size:12px}
nav button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;cursor:pointer}
nav button:hover{background:var(--navy2)}nav button[aria-current=true]{background:var(--gold);color:#0a1d3a;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-pronto{background:#4cc58a}.d-parcial{background:#f0b84a}.d-piloto{background:#b48be8}
main{padding:28px clamp(16px,3vw,44px);max-width:1180px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
h2{font:700 30px Georgia,serif;margin:0}
.route{font:13px ui-monospace,monospace;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.b-Pronto,.b-pronto{background:var(--okbg);color:var(--ok)}.b-Parcial,.b-parcial{background:var(--warnbg);color:var(--warn)}.b-Piloto,.b-piloto{background:var(--pilotbg);color:var(--pilot)}.b-Lacuna{background:var(--gapbg);color:var(--gap)}
.lead{color:var(--muted);font-size:16px;margin:4px 0 18px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
ul.acoes{list-style:none;margin:0;padding:0}
ul.acoes li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
ul.acoes li:first-child{border-top:0}
ul.acoes .badge{margin-top:1px;min-width:58px;text-align:center}
.shot{margin:0}.shot img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}
.shot figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:0;cursor:pointer;width:88px;overflow:hidden}
.thumbs button[aria-current=true]{border-color:var(--gold)}.thumbs img{width:100%;display:block}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:12px}
.who{font-size:14.5px}
.pager{display:flex;justify-content:space-between;margin:22px 0 0}
.pager button,.btn{font:inherit;font-weight:600;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat b{font:700 28px Georgia,serif;display:block}.stat span{font-size:13px;color:var(--muted)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mod{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;cursor:pointer;overflow:hidden;font:inherit;color:inherit}
.mod:hover{border-color:var(--gold)}.mod img{width:100%;height:130px;object-fit:cover;object-position:top;display:block;border-bottom:1px solid var(--line)}
.mod div{padding:10px 14px}.mod strong{display:block}.mod small{color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(4,10,22,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:8px}
.menu{display:none}
@media (max-width:860px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:none}nav.open{display:block}.menu{display:inline-block;margin:12px 16px 0}.grid{grid-template-columns:1fr}}
@media print{nav,.pager,.menu{display:none}.app{display:block}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>

  <div><div class="card"><h3>O que o Irmão pode fazer</h3><ul class="acoes">${m.acoes.map(a=>`<li><span class="badge b-${a[0]}">${a[0]}</span><span>${esc(a[1])}</span></li>`).join('')}</ul></div>
   <div class="card" style="margin-top:14px"><h3>Quem acessa</h3><div class="who">${esc(m.quem)}</div></div>
   ${m.notas.map(n=>`<div class="note">${esc(n)}</div>`).join('')}</div>
  <div><figure class="shot"><img id="big" src="prints/${s[0]}.jpg" alt="${esc(s[1])}"><figcaption>${esc(s[1])}</figcaption></figure>
   ${m.shots.length>1?`<div class="thumbs">${m.shots.map((t,k)=>`<button data-k="${k}" aria-current="${k===shot}" title="${esc(t[1])}"><img src="prints/${t[0]}.jpg" alt="${esc(t[1])}" loading="lazy"></button>`).join('')}</div>`:''}</div>
 </div>
 <div class="pager"><button id="prev" ${i<0?'disabled':''}>← ${i>0?esc(M[i-1].titulo):'Visão geral'}</button><button id="next" ${i>=M.length-1?'disabled':''}>${i<M.length-1?esc(M[i+1].titulo):''} →</button></div>`; }
function render(){ const main=$('#main'); main.innerHTML=cur<0?overview():module(cur); nav();
 main.querySelectorAll('.mod').forEach(b=>b.onclick=()=>go(+b.dataset.i));
 main.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>{shot=+b.dataset.k;render();});
 const big=$('#big'); if(big) big.onclick=()=>{$('#lb img').src=big.src;$('#lb').classList.add('on');};
 const p=$('#prev'),n=$('#next'); if(p)p.onclick=()=>go(cur-1); if(n)n.onclick=()=>go(cur+1);
 try{history.replaceState(null,'','#'+(cur<0?'geral':M[cur].id));}catch(e){} }
function go(i){ if(i<-1||i>=M.length)return; cur=i; shot=0; render(); $('#nav').classList.remove('open'); window.scrollTo(0,0); }
$('#lb').onclick=()=>$('#lb').classList.remove('on');
document.addEventListener('keydown',e=>{ if(e.key==='Escape')$('#lb').classList.remove('on');
 if(e.key==='ArrowRight')go(cur+1); if(e.key==='ArrowLeft')go(cur-1); });
$('#menu').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#menu').setAttribute('aria-expanded',o);};
const h=location.hash.slice(1); const hi=M.findIndex(m=>m.id===h); cur=hi;
render();
</script>
</body>
</html>
