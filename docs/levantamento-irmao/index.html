<script>
'use strict';
const assets={portal:'assets/portal.png',inovacao:'assets/inovacao.png',marcas:'assets/marcas.png',gestao:'assets/gestao.png',gleg:'assets/grande-loja.png'};
const slides=[{"id": "abertura", "kind": "hero", "sub": "Área do Irmão · Levantamento", "title": "O que o Portal<br>oferece ao Irmão", "body": "Módulos, funções e o que já está pronto,<br>em telas reais do Portal.", "bg": "inovacao", "notes": "Esta apresentação percorre a área que o Irmão acessa depois do login, módulo por módulo. Para cada um, mostramos uma tela real, explicamos para que serve e listamos o que o Irmão consegue fazer, com o estado de cada função: pronta, parcial, piloto ou ainda inexistente. A Administração e a Cripta ficaram de fora, por decisão da Loja. Tempo sugerido: 40 segundos."}, {"id": "escopo", "kind": "statement", "sub": "Escopo", "title": "A área que o Irmão<br>acessa depois do login", "body": "Doze módulos reunidos em um único ambiente restrito: agenda, avisos, comunidade, memória, biblioteca e formação. Ficam fora deste levantamento a Administração e a Cripta.", "notes": "O Portal é fechado: só entra quem tem conta e cadastro vinculado. O que cada Irmão vê depende do papel dele. Aqui descrevemos o que o papel de Membro enxerga. A parte administrativa serve a quem opera o Portal e não entra nesta conversa. A Cripta será discutida à parte. Tempo: 40 segundos."}, {"id": "como-ler", "kind": "curiosities", "title": "Como ler os estados", "sub": "Cada função recebe um selo. Ele diz o que o código entrega hoje, não o que foi testado em produção. Neste levantamento: 71 funções, 58 prontas.", "points": [["Pronto", "Tela, ação e regra implementadas. Funciona com o Portal configurado normalmente."], ["Parcial", "Funciona, mas com um limite conhecido. Exemplo: o uso offline só reabre páginas já visitadas."], ["Piloto", "Depende de integração ou credencial externa no servidor, como o Google Agenda."], ["Lacuna", "Não existe hoje. Está listada para a Loja decidir se vale construir."]], "notes": "Antes de entrar nos módulos, vale entender os quatro selos. Pronto quer dizer implementado no código. Isso não é o mesmo que validado em produção, porque este levantamento foi feito pela leitura do sistema e por prints em ambiente de teste. Parcial e Piloto mostram onde há dependências. Lacuna mostra o que ainda não existe. Tempo: 50 segundos."}, {"id": "modulos", "kind": "modules", "title": "Os doze módulos", "sub": "Toque em um módulo para ir direto a ele.", "groups": [["Rotina", [["Início", "inicio"], ["Minha Agenda", "agenda"], ["Notificações", "avisos"], ["Notícias", "noticias"], ["Links Úteis", "links"]]], ["Comunidade", [["Irmãos", "irmaos"], ["Paramaçônicas", "paramaconicas"]]], ["Memória", [["Acervo VL6", "acervo"]]], ["Formação", [["Biblioteca e Favoritos", "biblioteca"], ["Conhecimento VL6", "conhecimento"]]], ["Cuidado", [["Configurações", "config"], ["Termos, Offline e App", "app"]]], ["Resumo", [["Quem acessa o quê", "perfis"], ["Pontos de atenção", "atencao"]]]], "notes": "Este é o mapa. Os módulos estão agrupados pelo uso: rotina do dia a dia, comunidade, memória, formação e cuidado com a conta. Cada nome leva ao slide correspondente. Os dois últimos botões levam aos resumos finais: quem acessa o quê e os pontos de atenção. Tempo: 30 segundos."}, {"kind": "screen", "title": "Tudo o que importa, logo ao entrar", "body": "O Início é o painel de entrada. Reúne a próxima sessão, o próximo evento, os avisos importantes e as novidades da Loja, para que o Irmão veja de relance o que vem pela frente.", "benefit": "Menos procura, mais clareza sobre a próxima sessão.", "screen": "01-dashboard", "name": "Início do Irmão", "notes": "O Início é a primeira tela que o Irmão vê. Cada cartão aparece só se o perfil tem permissão para aquela informação. O ponto mais útil é a confirmação de presença direto no cartão da próxima sessão: um toque e a Secretaria já sabe. Tempo: 60 segundos.", "id": "inicio", "cont": false}, {"kind": "feature", "title": "Tudo o que importa, logo ao entrar", "sub": "O que o Irmão pode fazer (1/2)", "items": [["Próxima sessão e próximo evento", "Dois cards separados mostram data, horário e local. O Irmão confirma presença ou avisa que não poderá ir, sem sair do painel.", "Pronto"], ["Avisos e Central de Avisos", "Avisos importantes ficam em destaque, com atalho para a central completa de notificações.", "Pronto"], ["Agenda e próximas datas", "Lista das próximas sessões e eventos, com opção de adicionar à própria agenda.", "Pronto"], ["Memória e convivência do dia", "“Neste dia” traz lembranças do Acervo, e o painel mostra aniversariantes e notícias em destaque.", "Pronto"]], "notes": "O Início é a primeira tela que o Irmão vê. Cada cartão aparece só se o perfil tem permissão para aquela informação. O ponto mais útil é a confirmação de presença direto no cartão da próxima sessão: um toque e a Secretaria já sabe. Tempo: 60 segundos."}, {"kind": "feature", "title": "Tudo o que importa, logo ao entrar", "sub": "O que o Irmão pode fazer (2/2)", "items": [["Atalhos do Acervo", "Contagens de documentos, livros, fotos e favoritos, com acesso direto à Constelação.", "Pronto"], ["Saudação e citação do dia", "Saudação por horário, a gestão vigente e uma citação que muda diariamente.", "Pronto"]], "notes": "O Início é a primeira tela que o Irmão vê. Cada cartão aparece só se o perfil tem permissão para aquela informação. O ponto mais útil é a confirmação de presença direto no cartão da próxima sessão: um toque e a Secretaria já sabe. Tempo: 60 segundos."}, {"kind": "screen", "title": "Agenda que favorece a participação", "body": "A Minha Agenda junta, em uma só visão, as sessões e eventos da Loja, os aniversários, as paramaçônicas e os compromissos pessoais do Irmão. Ele escolhe como quer ver: hoje, semana, mês ou lista.", "benefit": "Mais clareza para planejar a presença e acompanhar atividades.", "screen": "02-agenda", "name": "Minha Agenda: visão mensal, filtros, tarefas e anotações", "notes": "A agenda reúne tudo em um só lugar. A janela padrão é o ano civil corrente; em dezembro inclui janeiro. A integração com o Google ainda é piloto, porque depende de credenciais configuradas pela equipe técnica. Sem elas, a agenda funciona normalmente com a Loja e os compromissos pessoais. Tempo: 70 segundos.", "id": "agenda", "cont": false}, {"kind": "feature", "title": "Agenda que favorece a participação", "sub": "O que o Irmão pode fazer (1/2)", "items": [["Visões e filtros", "Hoje, Semana, Mês e Lista. Filtros por sessões, eventos, aniversários, recessos, paramaçônicas, outras datas, pessoal e Google. Sessões ainda podem ser detalhadas por tipo, natureza, grau e acesso.", "Pronto"], ["Confirmar presença", "O Irmão confirma, recusa ou entra na lista de espera quando o evento exige confirmação. O detalhe do evento tem os mesmos botões.", "Pronto"], ["Compromissos, tarefas e anotações", "“Novo compromisso” com lembrete, lista de tarefas e bloco de anotações pessoais, tudo visível só para o próprio Irmão.", "Pronto"], ["Alerta de conflito", "Se dois compromissos coincidem no horário, a agenda avisa.", "Pronto"]], "notes": "A agenda reúne tudo em um só lugar. A janela padrão é o ano civil corrente; em dezembro inclui janeiro. A integração com o Google ainda é piloto, porque depende de credenciais configuradas pela equipe técnica. Sem elas, a agenda funciona normalmente com a Loja e os compromissos pessoais. Tempo: 70 segundos."}, {"kind": "feature", "title": "Agenda que favorece a participação", "sub": "O que o Irmão pode fazer (2/2)", "items": [["Levar a agenda para o celular", "Baixar um evento em .ics ou assinar a agenda da Loja (webcal). O link é pessoal e pode ser revogado.", "Pronto"], ["Google Agenda", "Conectar a conta Google importa eventos e sincroniza compromissos pessoais. Só funciona com credenciais Google configuradas no servidor. Eventos do Google são somente leitura.", "Piloto"]], "notes": "A agenda reúne tudo em um só lugar. A janela padrão é o ano civil corrente; em dezembro inclui janeiro. A integração com o Google ainda é piloto, porque depende de credenciais configuradas pela equipe técnica. Sem elas, a agenda funciona function render(){

 let common=`<header class="header"><img class="portal-small" src="${assets.portal}" alt="Portal VL6"><span>Verdadeira Luz nº 06</span></header>`;let c='';

 else if(s.kind==='statement')c=`<div class="content"><p class="eyebrow">${s.sub}</p><h2>${s.title}</h2><div class="rule"></div><p>${s.body}</p></div>`;

 else if(s.kind==='modules')c=`<div class="content"><h2>${s.title}</h2><p class="lead">${s.sub}</p><div class="module-grid">${s.groups.map(g=>`<div class="module-group"><h3>${g[0]}</h3><ul>${g[1].map(m=>`<li><button class="module-pill" data-jump="${m[1]}">${m[0]}</button></li>`).join('')}</ul></div>`).join('')}</div></div>`;
 else if(s.kind==='screen'){
  const left=s.body?`<h2>${s.title}</h2><p>${s.body}</p><div class="benefit">${s.benefit}</div>`:`<h2>${s.title}</h2><p>Mais telas deste módulo.</p>`;
  c=`<div class="content"><div>${left}</div><figure class="figure"><button class="imagebtn" id="screenzoom" aria-label="Ampliar tela ${esc(s.name)}"><img id="screenimg" src="${pr(s.screen)}" alt="Tela do Portal: ${esc(s.name)}"></button><figcaption><span id="screenname">${esc(s.name)}</span>${s.alternate?`<button class="switcher" id="switchscreen">Ver ${esc(s.alternate.name)}</button>`:'<span>Clique para ampliar</span>'}</figcaption></figure></div>`;}

 else c=`<div class="content"><h2>${s.title}</h2><p>${s.body}</p>${brandbar()}<a class="url" href="https://portal.vl6.com.br" target="_blank" rel="noopener noreferrer">portal.vl6.com.br</a></div>`;

 node.style.animation='none';void node.offsetHeight;node.style.animation='';
 $('count').textContent=`${current+1} / ${slides.length}`;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;
 $('progress').style.width=((current+1)/slides.length*100)+'%';
 $('live').textContent=`Slide ${current+1}: ${plain(s.title)}`;document.title=`${current+1}. ${plain(s.title)} — Portal VL6`;
 history.replaceState(null,'','#slide-'+(current+1));

 updateNotes();
}
function go(n){if(typeof n==='string'||Number.isNaN(Number(n))){const k=slides.findIndex(x=>x.id===n);if(k<0)return;n=k;}n=Math.max(0,Math.min(slides.length-1,Number(n)));if(n===current)return;current=n;render();}

function zoom(f,name){modal(`<h3>${esc(name)}</h3><img class="zoom-img" src="${pr(f)}" alt="Captura da tela ${esc(name)}"><p class="caption">Portal do Irmão VL6 · dados fictícios de demonstração</p>`);}

function hideControls(){document.body.classList.add('controls-hidden');}
function showControls(){document.body.classList.remove('controls-hidden');clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>{if(!$('dialog').open)hideControls();},3000);}
function toggleControls(){document.body.classList.contains('controls-hidden')?showControls():hideControls();}
document.addEventListener('keydown',e=>{if(e.key==='Tab')showControls();if($('dialog').open)return;
 if($('blackout').classList.contains('active')){if(['b','B','Escape',' '].includes(e.key)){e.preventDefault();blackout();}return;}
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1);}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1);}
 else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);}
 else if(e.key.toLowerCase()==='f')fullscreen();else if(e.key.toLowerCase()==='i')index();else if(e.key.toLowerCase()==='n')notes();else if(e.key.toLowerCase()==='b')blackout();else if(e.key.toLowerCase()==='a')effects();else if(e.key.toLowerCase()==='c'){e.preventDefault();toggleControls();}});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('index').onclick=index;$('fullscreen').onclick=fullscreen;$('notes').onclick=notes;$('animation').onclick=effects;$('blackout').onclick=blackout;$('hidecontrols').onclick=hideControls;
$('help').onclick=()=>modal('<h3>Controles da apresentação</h3><div class="helpgrid"><kbd>← →</kbd><span>Slide anterior ou próximo</span><kbd>Espaço</kbd><span>Avançar</span><kbd>F</kbd><span>Tela cheia</span><kbd>I</kbd><span>Índice de slides</span><kbd>N</kbd><span>Roteiro em janela separada</span><kbd>B</kbd><span>Tela preta ou retorno</span><kbd>A</kbd><span>Ativar ou desativar efeitos</span><kbd>C</kbd><span>Mostrar ou ocultar a barra de controles</span><kbd>Esc</kbd><span>Fechar ampliação ou índice</span></div><p style="margin-top:25px">Clique nas telas para ampliar. A apresentação funciona sem internet. Os prints usam dados fictícios.</p>');
$('dialog').querySelector('.close').onclick=()=>$('dialog').close();
$('dialog').addEventListener('click',e=>{const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close();});
document.addEventListener('pointermove',e=>{if(e.clientY>=innerHeight-85)showControls();});
let tx=0;document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;},{passive:true});document.addEventListener('touchend',e=>{if($('dialog').open)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>75)go(current+(dx<0?1:-1));},{passive:true});
window.addEventListener('resize',fit);
const initial=Number(location.hash.replace('#slide-',''));if(Number.isInteger(initial)&&initial>=1&&initial<=slides.length)current=initial-1;
fit();render();showControls();
</script></body></html>
